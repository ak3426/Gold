<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Voice Molten Gold</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}
button{
    position:absolute;
    top:20px;
    left:20px;
    z-index:100;
    padding:12px 20px;
    background:#d4af37;
    border:none;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>

<body>

<button id="startBtn">Activate Mic</button>
<canvas id="c"></canvas>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}
resize();

window.addEventListener("resize",resize);

let analyser;
let audioData;

const blobs=[];

// Create gold blobs
for(let i=0;i<12;i++){

    blobs.push({

        angle:Math.random()*Math.PI*2,
        orbit:Math.random()*200+100,
        radius:Math.random()*50+40,
        speed:(Math.random()-0.5)*0.01,
        offset:Math.random()*1000

    });

}

document.getElementById("startBtn")
.addEventListener("click",async()=>{

    const stream=
    await navigator.mediaDevices.getUserMedia({
        audio:true
    });

    const audioCtx=
    new AudioContext();

    analyser=
    audioCtx.createAnalyser();

    analyser.fftSize=2048;

    audioData=
    new Uint8Array(
        analyser.frequencyBinCount
    );

    const source=
    audioCtx.createMediaStreamSource(
        stream
    );

    source.connect(analyser);

});

function getVolume(){

    if(!analyser) return 0;

    analyser.getByteFrequencyData(audioData);

    let sum=0;

    for(let i=0;i<audioData.length;i++){

        sum+=audioData[i]*audioData[i];

    }

    return Math.sqrt(
        sum/audioData.length
    )/255;

}

let t=0;

function render(){

requestAnimationFrame(render);

t+=0.01;

const volume=getVolume();

ctx.fillStyle=
"rgba(0,0,0,0.08)";
ctx.fillRect(0,0,W,H);


// glow
ctx.shadowBlur=50;
ctx.shadowColor="#ffcc33";

for(let blob of blobs){

blob.angle+=blob.speed;

let x=
W/2+
Math.cos(blob.angle)*
blob.orbit*
(1+volume*2);

let y=
H/2+
Math.sin(blob.angle)*
blob.orbit*
(1+volume*2);


// MELTING EFFECT
let melt=
Math.sin(
t*3+
blob.offset
)*30*volume;

let r=
blob.radius+
melt;


// Gold gradient
let grad=
ctx.createRadialGradient(
x-r*0.2,
y-r*0.2,
0,
x,
y,
r
);

grad.addColorStop(
0,
"#fff9c4"
);

grad.addColorStop(
0.25,
"#ffe082"
);

grad.addColorStop(
0.5,
"#ffd54f"
);

grad.addColorStop(
0.8,
"#d4af37"
);

grad.addColorStop(
1,
"#5c3b00"
);

ctx.fillStyle=grad;


// organic liquid shape
ctx.beginPath();

for(let a=0;a<Math.PI*2;a+=0.2){

let wave=
Math.sin(
a*6+
t*5+
blob.offset
)*15*volume;

let rr=r+wave;

let px=
x+
Math.cos(a)*rr;

let py=
y+
Math.sin(a)*rr;

if(a===0){

ctx.moveTo(px,py);

}else{

ctx.lineTo(px,py);

}

}

ctx.closePath();

ctx.fill();

}

}

render();

</script>

</body>
</html>
