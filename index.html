<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Molten Gold Voice Visualizer</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

#ui{

position:absolute;
top:20px;
left:20px;
z-index:100;
color:#d4af37;

}

button{

padding:14px 25px;
border:none;
background:#d4af37;
color:black;
cursor:pointer;
font-size:15px;
font-weight:bold;
border-radius:8px;

}

h1{

font-size:18px;
letter-spacing:4px;
font-weight:100;

}

</style>

</head>

<body>

<div id="ui">

<h1>MOLTEN GOLD</h1>

<button id="startBtn">
ACTIVATE MIC
</button>

</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W,H;

function resize(){

W=
canvas.width=
innerWidth;

H=
canvas.height=
innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);


// AUDIO

let analyser;
let freqData;

document.getElementById(
"startBtn"
)
.addEventListener(
"click",
async()=>{

const stream=
await navigator
.mediaDevices
.getUserMedia({
audio:true
});

const audioCtx=
new AudioContext();

analyser=
audioCtx
.createAnalyser();

analyser.fftSize=2048;

freqData=
new Uint8Array(
analyser.frequencyBinCount
);

const source=
audioCtx
.createMediaStreamSource(
stream
);

source.connect(
analyser
);

}
);


function getAudioData(){

if(!analyser){

return{
vol:0,
bass:0,
treble:0
};

}

analyser.getByteFrequencyData(
freqData
);

let vol=0;
let bass=0;
let treble=0;


for(let i=0;i<freqData.length;i++){

vol+=freqData[i];

}

for(let i=0;i<40;i++){

bass+=freqData[i];

}

for(let i=250;i<500;i++){

treble+=freqData[i];

}

vol/=
freqData.length*255;

bass/=
40*255;

treble/=
250*255;

return{

vol,
bass,
treble

};

}



// GOLD MASS

const blobs=[];

for(let i=0;i<15;i++){

blobs.push({

angle:
Math.random()
*
Math.PI
*
2,

orbit:
Math.random()
*
250
+
60,

size:
Math.random()
*
80
+
80,

speed:
(
Math.random()
-
0.5
)
*
0.01,

offset:
Math.random()
*
1000

});

}


// DROPLETS

const droplets=[];

for(let i=0;i<50;i++){

droplets.push({

x:Math.random()*innerWidth,
y:Math.random()*innerHeight,

size:
Math.random()*5,

speed:
Math.random()*2

});

}


let t=0;

function draw(){

requestAnimationFrame(draw);

t+=0.01;

const audio=
getAudioData();


// slow trails

ctx.fillStyle=
"rgba(0,0,0,.06)";

ctx.fillRect(
0,
0,
W,
H
);


ctx.save();

ctx.shadowBlur=
80;

ctx.shadowColor=
"#ffcc00";

ctx.globalCompositeOperation=
"screen";



// GOLD BODY

for(let b of blobs){

b.angle+=
b.speed
*
(
1+
audio.bass*10
);


const x=
W/2+

Math.cos(
b.angle
)
*
b.orbit;


const y=
H/2+

Math.sin(
b.angle
)
*
b.orbit;



let pulse=

Math.sin(
t*4+
b.offset
)
*
(
40
+
audio.vol*100
);



let r=
b.size+
pulse;



const gradient=

ctx.createRadialGradient(

x-r*.2,
y-r*.2,
0,

x,
y,
r

);


gradient.addColorStop(
0,
"#fff8dc"
);

gradient.addColorStop(
0.2,
"#ffd700"
);

gradient.addColorStop(
0.5,
"#ffbf00"
);

gradient.addColorStop(
0.8,
"#d4af37"
);

gradient.addColorStop(
1,
"#3d2400"
);


ctx.fillStyle=
gradient;


ctx.beginPath();


for(
let a=0;
a<
Math.PI*2;
a+=0.1
){

let distortion=

Math.sin(
a*6+
t*5+
b.offset
)
*
(
20
+
audio.bass*80
);


let rr=
r+
distortion;


const px=
x+
Math.cos(a)
*
rr;

const py=
y+
Math.sin(a)
*
rr;


if(a===0){

ctx.moveTo(
px,
py
);

}else{

ctx.lineTo(
px,
py
);

}

}

ctx.closePath();

ctx.fill();

}


// floating droplets

for(let d of droplets){

d.y+=
d.speed+
audio.vol*5;

if(
d.y>
H+10
){

d.y=-10;
d.x=
Math.random()
*W;

}


ctx.beginPath();

ctx.fillStyle=
"#ffd700";

ctx.arc(
d.x,
d.y,
d.size+
audio.treble*8,
0,
Math.PI*2
);

ctx.fill();

}


ctx.restore();


// reflection strip

const reflection=

ctx.createLinearGradient(
0,
H*.6,
0,
H
);

reflection.addColorStop(
0,
"rgba(255,200,0,.2)"
);

reflection.addColorStop(
1,
"transparent"
);

ctx.fillStyle=
reflection;

ctx.fillRect(
0,
H*.6,
W,
H
);


}

draw();

</script>

</body>
</html>
