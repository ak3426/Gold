<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-2-Visuals: Molten Gold Resonance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;500&family=Space+Grotesk:wght@300&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #030200; /* Deep Obsidian Black */
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
            color: #fff;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Sophisticated Art Gallery HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 300;
            font-size: 24px;
            letter-spacing: 6px;
            color: rgba(212, 175, 55, 0.65); /* Muted Gold */
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .meta-info {
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            text-align: right;
            line-height: 1.6;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .controls-wrapper {
            pointer-events: auto;
        }

        button {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: rgba(212, 175, 55, 0.8);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(4px);
        }

        button:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            color: #fff;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Frequency Micro-bars for subtle feedback */
        #audio-radar {
            display: flex;
            gap: 4px;
            height: 20px;
            align-items: flex-end;
        }

        .radar-bar {
            width: 2px;
            height: 2px;
            background: rgba(212, 175, 55, 0.4);
            transition: height 0.1s ease;
        }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <div id="hud">
        <header>
            <div>
                <h1>AURUM RESONANCE</h1>
                <p class="meta-info" style="text-align: left; margin-top: 5px; color: rgba(212,175,55,0.4)">Acoustic Fluid Sculpture</p>
            </div>
            <div class="meta-info">
                Input: Mic Stream<br>
                Engine: Web Audio / 2D Compositor
            </div>
        </header>

        <footer>
            <div class="controls-wrapper">
                <button id="start-btn">Initialize Audio Capture</button>
            </div>
            <div id="audio-radar">
                <div class="radar-bar" id="r-bass"></div>
                <div class="radar-bar" id="r-low"></div>
                <div class="radar-bar" id="r-mid"></div>
                <div class="radar-bar" id="r-high"></div>
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        let W = window.innerWidth;
        let H = window.innerHeight;

        canvas.width = W;
        canvas.height = H;

        window.addEventListener('resize', () => {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
        });

        // Audio API Nodes
        let audioCtx, analyser, source;
        let freqData, timeData;
        let isRunning = false;

        // Smoothed audio parameters for elegant physics transitions
        let sRMS = 0, sBass = 0, sMid = 0, sHigh = 0;
        const sm = 0.08; // Ultra-smooth slow fluid integration constant

        // Fluid Sim Nodes (Droplets of molten gold)
        const droplets = [];
        const numDroplets = 45;

        class GoldDroplet {
            constructor() {
                this.reset();
                // Randomize positions evenly across center canvas initially
                this.x = Math.random() * W;
                this.y = Math.random() * H;
            }

            reset() {
                this.baseRadius = Math.random() * 40 + 30;
                this.radius = this.baseRadius;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.5 + 0.2;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.ox = W / 2;
                this.oy = H / 2;
                this.orbitR = Math.random() * (Math.min(W, H) * 0.25);
            }

            update(t) {
                // Audio forces distort paths elegantly
                const audioForce = sRMS * 4;
                
                // Orbital paths combined with noise shifting
                this.angle += (this.speed * 0.01) + (sMid * 0.02);
                
                // Target calculated positions
                const targetX = (W / 2) + Math.cos(this.angle) * (this.orbitR + sBass * 120);
                const targetY = (H / 2) + Math.sin(this.angle) * (this.orbitR + sBass * 80);

                // Smooth interpolation toward targets (creates viscosity behavior)
                this.x += (targetX - this.x) * 0.05;
                this.y += (targetY - this.y) * 0.05;

                // Pulsate fluid mass size via high frequencies
                this.radius = this.baseRadius + (sHigh * 45) + (Math.sin(t * 2 + this.baseRadius) * 8);
            }
        }

        // Initialize liquid nodes
        for(let i=0; i<numDroplets; i++) {
            droplets.push(new GoldDroplet());
        }

        // Connect Microphone
        document.getElementById('start-btn').addEventListener('click', async function() {
            if (isRunning) return;

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024;
            analyser.smoothingTimeConstant = 0.85; // High smoothing for premium motion design

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                freqData = new Uint8Array(analyser.frequencyBinCount);
                timeData = new Uint8Array(analyser.frequencyBinCount);
                
                isRunning = true;
                this.style.display = 'none'; // Fade button away out of view
                render(0);
            } catch (err) {
                alert('Audio access denied or unavailable: ' + err);
            }
        });

        function extractEnergy(data, startHz, endHz, sampleRate) {
            let sum = 0;
            let count = 0;
            const binWidth = sampleRate / (analyser.fftSize);
            for (let i = 0; i < data.length; i++) {
                const hz = i * binWidth;
                if (hz >= startHz && hz <= endHz) {
                    sum += data[i] / 255;
                    count++;
                }
            }
            return count > 0 ? sum / count : 0;
        }

        // Master Animation Loop
        function render(time) {
            requestAnimationFrame(render);
            const t = time * 0.001; // Seconds conversion

            if (isRunning && analyser) {
                analyser.getByteFrequencyData(freqData);
                analyser.getByteTimeDomainData(timeData);

                // Calculate RMS Volume
                let rmsSum = 0;
                for(let i=0; i<timeData.length; i++) {
                    let v = (timeData[i] - 128) / 128;
                    rmsSum += v * v;
                }
                let rms = Math.sqrt(rmsSum / timeData.length);

                const sr = audioCtx.sampleRate;
                const bass = extractEnergy(freqData, sr, 20, 250);
                const mid = extractEnergy(freqData, sr, 250, 2000);
                const high = extractEnergy(freqData, sr, 2000, 10000);

                // Apply exponential dampening for artistic physics
                sRMS = sRMS * (1 - sm) + rms * sm * 4;
                sBass = sBass * (1 - sm) + bass * sm * 3;
                sMid = sMid * (1 - sm) + mid * sm * 3;
                sHigh = sHigh * (1 - sm) + high * sm * 4.5;

                // UI Radar Displays updating
                document.getElementById('r-bass').style.height = `${sBass * 40 + 2}px`;
                document.getElementById('r-low').style.height = `${sRMS * 50 + 2}px`;
                document.getElementById('r-mid').style.height = `${sMid * 40 + 2}px`;
                document.getElementById('r-high').style.height = `${sHigh * 40 + 2}px`;
            } else {
                // Ambient behavior if mic is not active yet
                sRMS = sRMS * 0.98 + 0.05 * 0.02;
                sBass = sBass * 0.98 + 0.1 * 0.02;
                sMid = sMid * 0.98 + 0.08 * 0.02;
                sHigh = sHigh * 0.98 + 0.04 * 0.02;
            }

            // Artistic Frame Fade: Leaves subtle metallic dynamic trailing
            ctx.fillStyle = 'rgba(3, 2, 0, 0.18)'; 
            ctx.fillRect(0, 0, W, H);

            // COMPOSITE TRICK STEP 1: Draw blurry, soft golden spheres
            // Using a temporary blur context filter to simulate chemical surface tension (Metaballs)
            ctx.save();
            ctx.filter = 'blur(30px) contrast(30)'; // Magic combination makes vector circles meld like real liquids

            droplets.forEach(drop => {
                drop.update(t);

                // Dynamic HSL Formula: Shifts between polished 24K gold, bronze alloy shadows, and white-hot specular highlights
                // The light values adjust actively based on voice velocity metrics
                let hue = 38 + (sHigh * 10); // Subtle hue modulation (warms up with sibilance)
                let saturation = 75 + (sBass * 15);
                let lightness = 42 + (sRMS * 35); // Loud sounds make the gold gleam and glow white-hot

                ctx.beginPath();
                let gradient = ctx.createRadialGradient(drop.x, drop.y, 0, drop.x, drop.y, drop.radius);
                gradient.addColorStop(0, `hsl(${hue}, ${saturation}%, ${lightness}%)`);
                gradient.addColorStop(0.5, `hsl(${hue - 4}, ${saturation - 10}%, ${lightness * 0.6}%)`);
                gradient.addColorStop(1, 'rgba(0,0,0,0)'); // Edge transparency blends the fluid bodies
                
                ctx.fillStyle = gradient;
                ctx.arc(drop.x, drop.y, drop.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();

            // COMPOSITE TRICK STEP 2: Specular Shimmer Layer Overlay
            // Creates premium metallic reflections across the surface boundaries
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.filter = 'blur(4px)';
            
            ctx.beginPath();
            droplets.forEach((drop, idx) => {
                if(idx % 3 === 0) { // Render smaller internal specular light specs
                    ctx.fillStyle = `rgba(255, 235, 180, ${0.15 + (sRMS * 0.3)})`;
                    ctx.beginPath();
                    ctx.arc(drop.x - (drop.radius * 0.15), drop.y - (drop.radius * 0.15), drop.radius * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.restore();
        }

        // Fallback animation trigger for standalone local previews
        if (!isRunning) {
            render(0);
        }
    </script>
</body>
</html>
